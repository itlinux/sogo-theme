<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theme Generator</title>
<script src="angular.min.js"></script>
<script src="angular-animate.min.js"></script>
<script src="angular-aria.min.js"></script>
<script src="angular-material.min.js"></script>
<link rel="stylesheet" href="am-theme-src.css">
</head>
<body ng-app="themeGen">
<div style="font:14px system-ui;padding:1rem">Generating… check window.__themeCss</div>
<script>
// The palette. Angular Material wants a full 14-hue ramp per palette, so
// each one is built around the flavour's accent with the surface colours doing
// the work for backgrounds.
var PALETTE = {
  base:'#272727',
  mantle:'#1f1f1f',
  crust:'#181818',
  surface0:'#323232',
  surface1:'#3d3d3d',
  surface2:'#4a4a4a',
  overlay0:'#5a5a5a',
  overlay1:'#6e7681',
  overlay2:'#808080',
  subtext0:'#9aa3b0',
  subtext1:'#b6bdc8',
  text:'#d0d7e2',
  peach:'#ff8c00',
  maroon:'#cc6a00',
  flamingo:'#ffa94d',
  rosewater:'#ffc078',
  red:'#ff6b6b',
  yellow:'#ffd866',
  green:'#7ee787',
  blue:'#4dabf7',
  lavender:'#4dabf7',
  mauve:'#ff8c00',
  pink:'#ffa94d',
  sapphire:'#56d4dd',
  sky:'#56d4dd',
  teal:'#56d4dd'
};

// A ramp that keeps the flavour's own colour at 500 and shades around it.
function ramp(hex, contrast) {
  function mix(h, target, amt) {
    var r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    var tr = parseInt(target.slice(1,3),16), tg = parseInt(target.slice(3,5),16), tb = parseInt(target.slice(5,7),16);
    function c(a,bb){ return Math.round(a + (bb-a)*amt); }
    return '#' + [c(r,tr),c(g,tg),c(b,tb)].map(function(v){
      return ('0'+v.toString(16)).slice(-2);
    }).join('');
  }
  var light = '#ffffff', dark = PALETTE.crust;
  return {
    '50':  mix(hex, light, 0.72), '100': mix(hex, light, 0.56),
    '200': mix(hex, light, 0.40), '300': mix(hex, light, 0.24),
    '400': mix(hex, light, 0.12), '500': hex,
    '600': mix(hex, dark, 0.12),  '700': mix(hex, dark, 0.24),
    '800': mix(hex, dark, 0.36),  '900': mix(hex, dark, 0.50),
    'A100': mix(hex, light, 0.56), 'A200': hex,
    'A400': mix(hex, dark, 0.18),  'A700': mix(hex, dark, 0.34),
    'contrastDefaultColor': contrast,
    'contrastLightColors': contrast === 'dark' ? ['600','700','800','900','A400','A700'] : [],
    'contrastDarkColors':  contrast === 'light' ? ['50','100','200','300','A100'] : []
  };
}

// The background palette is what actually makes it dark: Angular Material's
// dark themes read their surfaces from here.
var BACKGROUND = {
  '50':  PALETTE.surface2, '100': PALETTE.surface1, '200': PALETTE.surface0,
  '300': PALETTE.base,     '400': PALETTE.mantle,   '500': PALETTE.base,
  '600': PALETTE.mantle,   '700': PALETTE.crust,    '800': PALETTE.base,
  '900': PALETTE.crust,
  'A100': PALETTE.surface0, 'A200': PALETTE.base,
  'A400': PALETTE.mantle,   'A700': PALETTE.crust,
  'contrastDefaultColor': 'light'
};

angular.module('themeGen', ['ngMaterial'])
  .config(['$mdThemingProvider', function($mdThemingProvider) {

    // SOGo maps specific hues onto specific chrome:
    //   primary '400' -> top toolbar      primary '600' -> sidebar toolbar
    //   accent  '600' -> FAB              accent  '300' -> centre list toolbar
    // The first attempt put the palette's ACCENT colours on primary, which is
    // why the toolbar came out lavender and the list bar pink. In the palette
    // the surfaces stay base/mantle/crust and the accent is used sparingly,
    // so the dark surfaces go on the hues that paint large areas and mauve is
    // kept for the FAB alone.
    var surfaces = {
      '50': PALETTE.surface2, '100': PALETTE.surface1, '200': PALETTE.surface0,
      '300': PALETTE.surface0, '400': PALETTE.mantle,  '500': PALETTE.base,
      '600': PALETTE.crust,    '700': PALETTE.crust,   '800': PALETTE.crust,
      '900': PALETTE.crust,
      'A100': PALETTE.surface1, 'A200': PALETTE.surface0,
      'A400': PALETTE.mantle,   'A700': PALETTE.crust,
      'contrastDefaultColor': 'light',
      'contrastLightColors': ['50','100','200','300','400','500','600','700','800','900','A100','A200','A400','A700'],
      'contrastDarkColors': []
    };

    // Mauve for the FAB ('600'), but '300' must stay a dark surface because
    // that hue paints the whole centre list toolbar.
    var accent = {
      '50': PALETTE.rosewater, '100': PALETTE.flamingo, '200': PALETTE.peach,
      '300': PALETTE.surface0, '400': PALETTE.peach,  '500': PALETTE.peach,
      '600': PALETTE.peach,   '700': PALETTE.peach,   '800': PALETTE.maroon,
      '900': PALETTE.maroon,
      'A100': PALETTE.flamingo, 'A200': PALETTE.peach,
      'A400': PALETTE.peach,    'A700': PALETTE.maroon,
      'contrastDefaultColor': 'dark',
      'contrastDarkColors': ['50','100','200','400','500','600','700','800','900','A100','A200','A400','A700'],
      'contrastLightColors': ['300']
    };

    $mdThemingProvider.definePalette('palSurface', surfaces);
    $mdThemingProvider.definePalette('palAccent', accent);
    $mdThemingProvider.definePalette('palRed', ramp(PALETTE.red, 'dark'));
    $mdThemingProvider.definePalette('palBackground', BACKGROUND);

    $mdThemingProvider.theme('default')
      .primaryPalette('palSurface', { 'default':'400','hue-1':'500','hue-2':'600','hue-3':'700' })
      .accentPalette('palAccent',   { 'default':'600','hue-1':'300','hue-2':'300','hue-3':'A700' })
      .warnPalette('palRed')
      .backgroundPalette('palBackground')
      .dark();

    $mdThemingProvider.generateThemesOnDemand(false);
  }])
  .run(function() {
    // Angular Material injects each generated theme as its own <style>. Collect
    // every rule mentioning the theme so nothing is missed.
    setTimeout(function() {
      var out = [];
      Array.prototype.forEach.call(document.querySelectorAll('style'), function(el) {
        var t = el.textContent || '';
        if (t.indexOf('md-default-theme') !== -1) out.push(t);
      });
      window.__themeCss = out.join('\n');
      window.__themeLen = window.__themeCss.length;
      document.body.firstElementChild.textContent =
        'done: ' + window.__themeLen + ' bytes of theme CSS';
    }, 600);
  });
</script>
</body>
</html>
